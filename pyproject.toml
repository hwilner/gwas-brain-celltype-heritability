[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celltype-heritability"
version = "0.1.0"
description = "Data-free utilities for mapping GWAS heritability to brain cell types (Paper 1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harel Wilner" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
# matplotlib is optional so the core statistics install stays light; it is
# required for the figure scripts (src/celltype_heritability/figures.py) and
# their tests, so it is also part of the dev extra used by CI.
dev = ["pytest", "matplotlib"]
figures = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
